<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeStart Guide | Get Started</title>

    <meta name="description" content="Tell us about your programming goals and get started learning.">

    <meta name="author" content="Matheus Rodrigues">

    <!-- Open Graph -->
    <meta property="og:title" content="CodeStart Guide">
    <meta property="og:description" content="Learn programming, discover languages, and explore tech careers.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/hero.webp">

    <link rel="icon" href="images/favicon.ico">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/large.css">

    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/date.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>

        <div class="logo">
            <h2>CodeStart Guide</h2>
        </div>

        <button id="menu-btn" aria-label="Open navigation menu">
            &#9776;
        </button>

        <nav id="navigation">
            <a href="index.html">Home</a>
            <a href="languages.html">Languages</a>
            <a href="careers.html">Careers</a>
            <a href="form.html" class="active">Get Started</a>
        </nav>

    </header>

    <main>

        <section class="hero">
            <h1>Get Started with Programming</h1>

            <p>
                Tell us about your interests and goals.
            </p>
        </section>

        <section class="form-section">

            <form method="get" action="thanks.html">

                <label for="fullname">
                    Full Name
                </label>

                <input type="text" id="fullname" name="fullname" required>

                <label for="email">
                    Email Address
                </label>

                <input type="email" id="email" name="email" required>

                <label for="experience">
                    Programming Experience
                </label>

                <select id="experience" name="experience" required>

                    <option value="">Select an option</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>

                </select>

                <label for="goal">
                    Learning Goal
                </label>

                <textarea id="goal" name="goal" rows="5" required></textarea>

                <input type="submit" value="Submit">

            </form>

        </section>

    </main>

    <footer>

        <p>
            &copy; <span id="currentyear"></span> CodeStart Guide
        </p>
        <p id="lastModified"></p>

        <p>
            <a href="attributions.html">Attributions</a>
        </p>

        <p>
            <a href="#">Video Demonstration</a>
        </p>

    </footer>

</body>

</html>
